name: Swift

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - ".github/workflows/swift.yml"
              - "conformance/**"
              - "swift/**"

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The toolchain's swift-format, whose versions format alike only mostly
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Run formatting check
        run: swift format lint --strict --recursive Package.swift Sources Tests Fuzz/Package.swift Fuzz/Sources

  linux:
    name: Test (Linux, Swift ${{ matrix.swift }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:${{ matrix.swift }}-noble
    defaults:
      run:
        working-directory: swift
    strategy:
      fail-fast: false
      matrix:
        # The package's swift-tools-version, and the latest release
        swift: ["6.2", "6.4"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Print the Swift version
        run: swift --version

      # The conformance suite, the property tests and the examples
      - name: Run tests
        run: swift test

      # Optimized, where only preconditions and overflow checks remain of the
      # standard library's checks, as in an application's release build
      - name: Run tests optimized
        run: swift test -c release -Xswiftc -enable-testing

      # Reads and writes every array element by element, as on a big-endian
      # host, rather than in place
      - name: Run tests of the portable path
        run: swift test --scratch-path .build/portable -Xswiftc -DTAFLA_PORTABLE

  sanitizers:
    name: Test (AddressSanitizer)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Every read stays within the bytes it was given, which the runtime
      # loads from without the standard library's checks once it's checked
      # them itself. Without LeakSanitizer, as on macOS: it reports the
      # conformance suite that the tests keep in a static, whose arrays Swift
      # refers to from enum payloads that it doesn't recognize as pointers.
      - name: Run tests with AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Linux's toolchain, which has libFuzzer's runtime, unlike Xcode's
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: swift/Fuzz
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzTableReader, FuzzConformance]
    # Without LeakSanitizer, as in the tests, and without Swift's backtracer,
    # which held a crash for minutes rather than let libFuzzer report it
    env:
      ASAN_OPTIONS: detect_leaks=0
      SWIFT_BACKTRACE: enable=no
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Build the fuzz target
        run: swift build -c release --sanitize=fuzzer --sanitize=address --product ${{ matrix.target }}

      # Briefly, from the conformance suite's tables, so that a change that
      # breaks a target, or that it finds quickly, fails here. libFuzzer
      # writes a failing input to .build/artifacts, which the step uploads.
      - name: Run the fuzz target
        run: |
          mkdir -p .build/corpus .build/artifacts
          "$(swift build -c release --sanitize=fuzzer --sanitize=address --show-bin-path)/${{ matrix.target }}" \
              .build/corpus ../../conformance/valid ../../conformance/equivalent ../../conformance/invalid \
              -max_total_time=60 -timeout=10 -artifact_prefix=.build/artifacts/

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: swift/Fuzz/.build/artifacts
          if-no-files-found: ignore

  macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: swift
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # The runner image's default Xcode, which changes with the image
      - name: Print the Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Run tests optimized
        run: swift test -c release -Xswiftc -enable-testing

      # Compiles the paths for hosts whose Int is 32 bits, such as watchOS's
      # arm64_32, which type-checks them without running them: no runner has
      # such a host. For watchOS 9, the earliest that the package supports.
      - name: Build for a 32-bit target
        run: |
          swift build --scratch-path .build/watchos --target Tafla \
              --triple arm64_32-apple-watchos9.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

  # The comparison with other libraries, a package of its own, so that the
  # runtime's package depends on none of them. Shared runners are too noisy
  # for its timings, so this checks that it builds and reads back what every
  # codec wrote.
  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: swift/benchmarks
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Its own code, apart from the code that FlatBuffers' and protobuf's
      # generators generated in their style
      - name: Run formatting check
        run: |
          swift format lint --strict --recursive Package.swift Tests Sources/Workloads Sources/Codecs \
              Sources/Harness Sources/Reporting Sources/Comparison Sources/Lists Sources/Encoding \
              Sources/GeneratedTafla Sources/GeneratedLists

      # The workloads' values and the lists' strings, and that every codec
      # reads back what it wrote, built as the comparison is
      - name: Run tests optimized
        run: swift test -c release

      - name: Print the encoded sizes
        run: swift run -c release Encoding

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Swift.
  checks:
    name: Swift checks
    needs: [changes, formatting, linux, sanitizers, fuzz, macos, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
