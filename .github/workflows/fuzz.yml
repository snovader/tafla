name: Fuzz

# Weekly, rather than on every change, since a run takes minutes of each
# target's time to find anything. The Rust workflow lints the fuzz targets on
# every change, so that they keep building, and the Go, C++, Swift and C#
# workflows run their targets briefly.
on:
  schedule:
    # Mondays at 04:17 UTC, off the hour that most scheduled workflows start
    - cron: "17 4 * * 1"

  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target for
        type: number
        default: 300

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arbitrary bytes, read with every getter at every position
          - target: table_reader
            seeds: ../conformance/valid ../conformance/equivalent ../conformance/invalid
            options: ""
          # The suite's tables, mutated and read as its descriptions
          - target: conformance
            seeds: ../conformance/valid ../conformance/equivalent ../conformance/invalid
            options: ""
          # Arbitrary text, parsed, checked and generated from
          - target: gen
            seeds: ../schemas gen/tests/diagnostics
            options: -dict=fuzz/gen.dict
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          cache-workspaces: rust/fuzz -> target
          cache-key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The corpus that earlier runs grew, so that each run starts where the
      # last left off. A run saves its own under a new key.
      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: rust/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build the fuzz targets
        run: cargo +nightly fuzz build

      # A hang of 10 seconds on one input, or a run out of memory, fails as a
      # crash does
      - name: Run the fuzz target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} \
              fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- \
              -max_total_time="$SECONDS_PER_TARGET" -timeout=10 ${{ matrix.options }}

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: rust/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Go's native fuzz targets, which mirror the runtime's Rust targets, seeded
  # with the conformance suite's tables
  fuzz-go:
    name: Fuzz Go (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go/tests
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzTableReader, FuzzConformance]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Without the build cache, which would save the corpus under go.sum's
      # key; the next step keeps it instead
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # Go grows a target's corpus in its build cache, rather than in the
      # repository
      - name: Find the corpus
        id: corpus
        run: echo "path=$(go env GOCACHE)/fuzz/github.com/snovader/tafla/go/tests/${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.corpus.outputs.path }}
          key: fuzz-go-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-go-corpus-${{ matrix.target }}-

      # Go writes an input that fails to testdata/fuzz
      - name: Run the fuzz target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "${SECONDS_PER_TARGET}s" .

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-go-artifacts-${{ matrix.target }}
          path: go/tests/testdata/fuzz
          if-no-files-found: ignore

  # C++'s libFuzzer targets, which mirror the runtime's Rust targets, with
  # the sanitizers
  fuzz-cpp:
    name: Fuzz C++ (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cpp
    strategy:
      fail-fast: false
      matrix:
        target: [table_reader, conformance]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # With Clang's runtime of libFuzzer and the sanitizers, whose package is
      # named after the default Clang's major version
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build \
              "libclang-rt-$(clang++ -dumpversion | cut -d. -f1)-dev"

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: cpp/build/corpus/${{ matrix.target }}
          key: fuzz-cpp-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-cpp-corpus-${{ matrix.target }}-

      - name: Build the fuzz target
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ \
              -DTAFLA_BUILD_FUZZERS=ON -DTAFLA_SANITIZERS=address,undefined
          cmake --build build --target fuzz_${{ matrix.target }}

      # libFuzzer writes an input that fails to the working directory
      - name: Run the fuzz target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: |
          mkdir -p build/corpus/${{ matrix.target }} build/artifacts
          build/fuzz/fuzz_${{ matrix.target }} build/corpus/${{ matrix.target }} ../conformance/valid \
              ../conformance/equivalent ../conformance/invalid -max_total_time="$SECONDS_PER_TARGET" -timeout=10 \
              -artifact_prefix=build/artifacts/

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-cpp-artifacts-${{ matrix.target }}
          path: cpp/build/artifacts
          if-no-files-found: ignore

  # Swift's libFuzzer targets, which mirror the runtime's Rust targets, with
  # AddressSanitizer
  fuzz-swift:
    name: Fuzz Swift (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Linux's toolchain, which has libFuzzer's runtime, unlike Xcode's
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: swift/Fuzz
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzTableReader, FuzzConformance]
    # Without LeakSanitizer, as in the tests, and without Swift's backtracer,
    # which held a crash for minutes rather than let libFuzzer report it
    env:
      ASAN_OPTIONS: detect_leaks=0
      SWIFT_BACKTRACE: enable=no
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: swift/Fuzz/.build/corpus/${{ matrix.target }}
          key: fuzz-swift-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-swift-corpus-${{ matrix.target }}-

      - name: Build the fuzz target
        run: swift build -c release --sanitize=fuzzer --sanitize=address --product ${{ matrix.target }}

      # libFuzzer writes an input that fails to .build/artifacts
      - name: Run the fuzz target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: |
          mkdir -p .build/corpus/${{ matrix.target }} .build/artifacts
          "$(swift build -c release --sanitize=fuzzer --sanitize=address --show-bin-path)/${{ matrix.target }}" \
              .build/corpus/${{ matrix.target }} ../../conformance/valid ../../conformance/equivalent \
              ../../conformance/invalid -max_total_time="$SECONDS_PER_TARGET" -timeout=10 \
              -artifact_prefix=.build/artifacts/

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-swift-artifacts-${{ matrix.target }}
          path: swift/Fuzz/.build/artifacts
          if-no-files-found: ignore

  # C#'s fuzz targets, which mirror the runtime's Rust targets, run under
  # libFuzzer through SharpFuzz, which instruments the runtime's IL
  fuzz-csharp:
    name: Fuzz C# (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: csharp
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Restores the targets' packages as their packages.lock.json locks them
      ContinuousIntegrationBuild: "true"
    strategy:
      fail-fast: false
      matrix:
        target: [table_reader, conformance]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Clang's runtime of libFuzzer, to build libfuzzer-dotnet with, whose
      # package is named after the default Clang's major version
      - name: Install libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
              "libclang-rt-$(clang++ -dumpversion | cut -d. -f1)-dev"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: csharp/artifacts/fuzz/corpus/${{ matrix.target }}
          key: fuzz-csharp-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-csharp-corpus-${{ matrix.target }}-

      # fuzz.sh builds libfuzzer-dotnet and the targets, and runs the target
      # from the corpus and the conformance suite's tables. libFuzzer writes
      # an input that fails to artifacts/fuzz/<target>/.
      - name: Run the fuzz target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: fuzz/fuzz.sh ${{ matrix.target }} -max_total_time="$SECONDS_PER_TARGET" -timeout=10

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-csharp-artifacts-${{ matrix.target }}
          path: csharp/artifacts/fuzz/${{ matrix.target }}
          if-no-files-found: ignore
