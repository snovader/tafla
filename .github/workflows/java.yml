name: Java

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            java:
              - ".github/workflows/java.yml"
              - "conformance/**"
              - "java/**"

  build:
    name: Build (Java ${{ matrix.java_version }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: java
    strategy:
      fail-fast: false
      matrix:
        java_version: [21, 25]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: ${{ matrix.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle build
        run: ./gradlew build javadoc -PtestJavaVersion=${{ matrix.java_version }}

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: ./gradlew :benchmarks:test

      - name: Run benchmarks briefly
        run: ./gradlew :benchmarks:jmh --jmhArgs="-f 1 -wi 1 -w 100ms -i 1 -r 100ms"

      - name: Print encoded sizes
        run: ./gradlew :benchmarks:encodingReport

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Java.
  checks:
    name: Java checks
    needs: [changes, build, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
