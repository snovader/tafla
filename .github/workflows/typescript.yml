name: TypeScript

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            typescript:
              - ".github/actions/prepare-node-dependencies/action.yml"
              - ".github/actions/prepare-node-environment/action.yml"
              - ".github/workflows/typescript.yml"
              # oxfmt's root configuration, which typescript/'s is nested in
              - "oxfmt.config.ts"
              - "conformance/**"
              - "typescript/**"
            # @tafla/gen, which runs the generator's WebAssembly module, and
            # the generator, the schemas and the golden files that its tests
            # generate
            generator:
              - ".github/actions/prepare-node-dependencies/action.yml"
              - ".github/actions/prepare-node-environment/action.yml"
              - ".github/workflows/typescript.yml"
              - "typescript/**"
              - "rust/Cargo.*"
              - "rust/rust-toolchain.toml"
              - "rust/gen/**"
              - "schemas/**"
              - "python/core/tests/generated/**"

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Run format check
        run: yarn format:check

      - name: Run lint check
        run: yarn lint:check

      - name: Run type check
        run: yarn typecheck

      - name: Check the package
        run: yarn package:check

  test:
    name: Test (Node ${{ matrix.node_version }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node_version: ["24.x", "26.x"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies
        with:
          node-version: ${{ matrix.node_version }}

      - name: Run tests
        run: yarn test

  # Builds the generator's WebAssembly module and @tafla/gen, and runs the
  # package's command and API from its build
  generator:
    name: Generator package
    needs: changes
    if: needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Build the package and run its tests
        run: yarn test:gen

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that the benchmarks work, that every getter and setter reads or
      # writes the values it should, and that every codec in the comparison
      # and the strings comparison reads back what it wrote
      - name: Run benchmarks
        run: yarn bench --rounds 3 --sample-ms 0.2

      - name: Run comparison
        run: yarn bench:compare --rounds 3 --sample-ms 0.2

      - name: Run strings comparison
        run: yarn bench:strings --rounds 3 --sample-ms 0.2

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch TypeScript.
  checks:
    name: TypeScript checks
    needs: [changes, verify, test, generator, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
