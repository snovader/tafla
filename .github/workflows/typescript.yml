name: TypeScript

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            typescript:
              - ".github/actions/prepare-node-dependencies/action.yml"
              - ".github/actions/prepare-node-environment/action.yml"
              - ".github/workflows/typescript.yml"
              # Biome's root configuration, which typescript/'s is nested in
              - "biome.jsonc"
              - "conformance/**"
              - "typescript/**"

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Run format check
        run: yarn format:check

      - name: Run lint check
        run: yarn lint:check

      - name: Run type check
        run: yarn typecheck

      - name: Check the package
        run: yarn package:check

      - name: Vulnerability audit
        run: yarn npm audit -RA

  test:
    name: Test (Node ${{ matrix.node_version }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    strategy:
      fail-fast: false
      matrix:
        node_version: ["24.x", "26.x"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies
        with:
          node-version: ${{ matrix.node_version }}

      - name: Run tests
        run: yarn test

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that the benchmarks work, and that every codec in the comparison
      # reads back what it wrote
      - name: Run benchmarks
        run: yarn bench

      - name: Run comparison
        run: yarn bench:compare --rounds 3 --sample-ms 0.2

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch TypeScript.
  checks:
    name: TypeScript checks
    needs: [changes, verify, test, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
