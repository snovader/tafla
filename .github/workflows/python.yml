name: Python

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - ".github/workflows/python.yml"
              - "conformance/**"
              - "python/**"
              # The example schemas, whose generated code the tests run
              - "schemas/**"

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      - name: Run format check
        run: uv run --locked ruff format --check

      - name: Run lint check
        run: uv run --locked ruff check

      - name: Run type check
        run: uv run --locked ty check

  test:
    name: Test (Python ${{ matrix.python_version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.14", "3.15"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python_version }}
          working-directory: python

      - name: Run tests
        run: uv run --locked python -m unittest discover -s core/tests -t core

      - name: Run benchmarks' tests
        run: uv run --locked python -m unittest discover -s benchmarks/tests -t benchmarks

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: uv run --locked python -m unittest discover -s benchmarks/tests -t benchmarks -p test_round_trips.py

      - name: Run benchmarks briefly
        run: uv run --locked python -m tafla_benchmarks --debug-single-value --quiet

      # protobuf's implementation is chosen when a process first imports it, so
      # its pure-Python implementation runs in a process of its own. The
      # round-trip test runs it in one too.
      - name: Run pure protobuf's benchmarks briefly
        run: uv run --locked python -m tafla_benchmarks --codec protobuf --debug-single-value --quiet
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

      - name: Print encoded sizes
        run: uv run --locked python -m tafla_benchmarks.encoding

      - name: Print allocations
        run: uv run --locked python -m tafla_benchmarks.allocation

      - name: Print pure protobuf's allocations
        run: uv run --locked python -m tafla_benchmarks.allocation --codec protobuf
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Python.
  checks:
    name: Python checks
    needs: [changes, verify, test, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
