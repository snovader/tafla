name: Python

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - ".github/workflows/python.yml"
              - "conformance/**"
              - "python/**"
              # Which writes the version into the native crate's lock file
              - "scripts/set-version.sh"
              # The Rust runtime, which the native classes build on
              - "rust/Cargo.toml"
              - "rust/core/**"
              # The example schemas, whose generated code the tests run
              - "schemas/**"

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Rust builds the native classes, which uv installs with the workspace
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          cache-workspaces: python/core/native -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      - name: Run format check
        run: uv run --locked ruff format --check

      - name: Run lint check
        run: uv run --locked ruff check

      - name: Run type check
        run: uv run --locked ty check

      - name: Run format check of the native classes
        working-directory: python/core/native
        run: cargo fmt --check

      # As the wheels build it, and with the tests' hooks, as the development
      # environment builds it
      - name: Run lint check of the native classes
        working-directory: python/core/native
        run: |
          PYO3_PYTHON="$(uv python find 3.14)" cargo clippy --all-targets -- -D warnings
          PYO3_PYTHON="$(uv python find 3.14)" cargo clippy --all-targets --all-features -- -D warnings

      - name: Run the native classes' Rust tests
        working-directory: python/core/native
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo test --all-features

      # The release builds the wheels with --locked, so a new version must
      # reach the native crate's lock file, which records the Rust runtime's
      - name: Check that setting a version keeps the native crate's lock file
        working-directory: .
        run: |
          scripts/set-version.sh 99.0.0
          cargo metadata --locked --format-version 1 --manifest-path python/core/native/Cargo.toml > /dev/null
          git checkout -- .

  # The native classes' Rust tests with the crate's rust-version, the oldest
  # Rust that builds the wheels from the source distribution
  msrv:
    name: Test the native classes (Rust 1.88)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python/core/native
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.88"
          cache-workspaces: python/core/native -> target
          cache-key: "1.88"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      - name: Run the native classes' Rust tests
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo +1.88 test --all-features

  test:
    name: Test (Python ${{ matrix.python_version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        # With and without the GIL, which the native classes run without
        python_version: ["3.14", "3.15", "3.14t", "3.15t"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: python/core/native -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python_version }}
          working-directory: python

      - name: Check that tafla uses the native classes
        run: uv run --locked python -c "import tafla; assert tafla.IMPLEMENTATION == 'native', tafla.IMPLEMENTATION"

      - name: Run tests
        run: uv run --locked python -m unittest discover -s core/tests -t core

      - name: Run benchmarks' tests
        run: uv run --locked python -m unittest discover -s benchmarks/tests -t benchmarks

      - name: Run tests with the pure-Python classes
        env:
          TAFLA_PUREPYTHON: "1"
        run: |
          uv run --locked python -c "import tafla; assert tafla.IMPLEMENTATION == 'python', tafla.IMPLEMENTATION"
          uv run --locked python -m unittest discover -s core/tests -t core

      - name: Run benchmarks' tests with the pure-Python classes
        env:
          TAFLA_PUREPYTHON: "1"
        run: uv run --locked python -m unittest discover -s benchmarks/tests -t benchmarks

  # The distributions as they'd be published: the source distribution and a
  # wheel with the native classes, which maturin builds, and the pure-Python
  # wheel, which uv_build builds, each installed on its own and running the
  # package's examples
  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: python/core/native -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      - name: Build the source distribution and the native wheel
        run: uv build --package tafla --out-dir dist

      - name: Build the pure-Python wheel
        working-directory: python/core
        run: uv run --isolated --no-project --with 'uv-build==0.13.7' python -c "import uv_build; print(uv_build.build_wheel('../dist'))"

      # The wheel that the source distribution built, and the pure-Python one
      - name: Test each wheel on its own
        run: scripts/test-wheels.sh dist

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: python/core/native -> target

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: uv run --locked python -m unittest discover -s benchmarks/tests -t benchmarks -p test_round_trips.py

      - name: Run benchmarks briefly
        run: uv run --locked python -m tafla_benchmarks --debug-single-value --quiet

      - name: Print encoded sizes
        run: uv run --locked python -m tafla_benchmarks.encoding

      - name: Print allocations
        run: uv run --locked python -m tafla_benchmarks.allocation

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Python.
  checks:
    name: Python checks
    needs: [changes, verify, msrv, test, package, benchmark]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
