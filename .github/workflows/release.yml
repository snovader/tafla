name: Release

# Publishes one of tafla's packages, each of which has a version of its own,
# as RELEASING.md describes. A manual run on main names the package and its
# version, checks the package and builds its artifacts, publishes them, and
# then tags the commit <package>/v<version>. Each registry has jobs that check
# its language and build its artifacts, which a dry run uploads to the
# workflow run, and a job that publishes them. The Go module is published by
# its tag, go/v<version>, which its publish job pushes once the module has
# built, and from which the Go module proxy builds it.
#
# A dry run builds without publishing: a manual run does, unless it's on main
# with dry_run turned off, and so does a pull request, for each package whose
# version it changes, and for every package when it changes the release's own
# files.

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      package:
        description: "The package to release"
        type: choice
        options:
          - typescript
          - python
          - java
          - rust
          - tafla-gen
          - go
      version:
        description: "Its version, which must be its manifest's. The Go module records none, so this is its version."
        type: string
        required: true
      dry_run:
        description: "Build the package without publishing it. A run that isn't on main never publishes."
        type: boolean
        default: true

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  # One package's release doesn't wait for another's
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.package }}
  # A release runs to its end, and a pull request's dry run gives way to a newer
  # one
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which packages the jobs below build, and whether they publish. It
  # runs on every pull request, so that a package whose manifest and lock files
  # disagree on its version fails.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.dispatch.outputs.packages || steps.pull_request.outputs.packages }}
      publish: ${{ steps.dispatch.outputs.publish || 'false' }}
      go_version: ${{ steps.dispatch.outputs.go_version || steps.pull_request.outputs.go_version }}
    steps:
      # A pull request's checkout is the merge of its branch into main, which
      # it compares with its first parent, main
      - name: Checkout GitHub repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # A manual run builds the package that it names, and publishes it if
      # it's on main and not a dry run
      - name: Plan a manual run
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$VERSION isn't a version of the form MAJOR.MINOR.PATCH"
            exit 1
          fi

          if [[ "$PACKAGE" != go ]]; then
            own=$(scripts/version.sh "$PACKAGE")
            if [[ "$own" != "$VERSION" ]]; then
              echo "::error::The run releases $PACKAGE $VERSION, but $PACKAGE's version is $own"
              exit 1
            fi
          fi

          publish=false
          if [[ "$REF" == refs/heads/main && "$DRY_RUN" == false ]]; then
            publish=true
          fi

          {
            echo "packages=$(jq -cn '$ARGS.positional' --args "$PACKAGE")"
            echo "publish=$publish"
            echo "go_version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE $VERSION, publish: $publish"

      # A registry rejects a version that it has, so a release whose tag
      # names another commit fails before it builds
      - name: Check the release's tag
        if: steps.dispatch.outputs.publish == 'true'
        uses: ./.github/actions/release-tag
        with:
          tag: ${{ inputs.package }}/v${{ inputs.version }}

      # A pull request builds each package whose version it changes, which a
      # release of the version would build, and every package when it changes
      # the release's own files. Each package's manifest and lock files must
      # agree on its version.
      - name: Plan a pull request
        if: github.event_name == 'pull_request'
        id: pull_request
        run: |
          # main's files, read with this branch's script
          base="$RUNNER_TEMP/base"
          git worktree add --quiet --detach "$base" HEAD^1
          cp scripts/version.sh "$base/scripts/version.sh"

          packages=()
          for package in typescript python java rust tafla-gen; do
            version=$(scripts/version.sh "$package")
            base_version=$("$base/scripts/version.sh" "$package" 2> /dev/null || true)
            if [[ "$version" != "$base_version" ]]; then
              packages+=("$package")
            fi
          done

          changed=$(git diff --name-only HEAD^1 HEAD)
          touches() {
            local path
            for path in "$@"; do
              if grep -qxF "$path" <<< "$changed"; then
                return 0
              fi
            done
            return 1
          }

          if touches .github/workflows/release.yml .github/actions/release-tag/action.yml scripts/version.sh; then
            packages=(typescript python java rust tafla-gen go)
          fi
          if touches python/scripts/test-wheels.sh; then
            packages+=(python)
          fi
          if touches go/go.mod; then
            packages+=(go)
          fi

          # The Go module has no version until its release names one, so its
          # dry run takes the first of its major version, which go.mod's
          # module path ends with from 2 on
          major=$(sed -nE 's#^module github\.com/snovader/tafla/go/v([0-9]+)$#\1#p' go/go.mod)

          {
            echo "packages=$(jq -cn '$ARGS.positional' --args "${packages[@]}")"
            echo "go_version=${major:-0}.0.0"
          } >> "$GITHUB_OUTPUT"
          echo "Packages: ${packages[*]:-none}"

  # npm

  npm-build:
    name: npm (check and pack)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'typescript')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Run format check
        run: yarn format:check

      - name: Run lint check
        run: yarn lint:check

      - name: Run type check
        run: yarn typecheck

      - name: Check the package
        run: yarn package:check

      - name: Run tests
        run: yarn test

      - name: Pack the package
        run: yarn workspace tafla pack --out "$RUNNER_TEMP/npm/%s-%v.tgz"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error

  npm-publish:
    name: npm (publish)
    needs: [plan, npm-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/tafla/v/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing and provenance
      id-token: write
    defaults:
      run:
        working-directory: typescript/core
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      # Yarn exchanges the workflow's OIDC token for one that publishes, as
      # the package's trusted publisher on npm allows. npm can only trust a
      # publisher for a package that exists, so an NPM_TOKEN secret, if set,
      # publishes instead, as the first release needs.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            export YARN_NPM_AUTH_TOKEN="$NPM_TOKEN"
          fi
          yarn npm publish --provenance --access public

  # PyPI

  # Checks both implementations of the Python runtime, and builds the
  # distributions that install anywhere: the source distribution, which builds
  # the native classes with Rust, and the pure-Python wheel, which pip installs
  # where no native wheel fits
  pypi-build:
    name: PyPI (check and build)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'python')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Rust builds the native classes, which uv installs with the workspace
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          cache-workspaces: python/core/native -> target
          cache-key: release

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          working-directory: python

      - name: Run format check
        run: uv run --locked ruff format --check

      - name: Run lint check
        run: uv run --locked ruff check

      - name: Run type check
        run: uv run --locked ty check

      - name: Run format check of the native classes
        working-directory: python/core/native
        run: cargo fmt --check

      - name: Run lint check of the native classes
        working-directory: python/core/native
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo clippy --all-targets -- -D warnings

      - name: Run the native classes' Rust tests
        working-directory: python/core/native
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo test

      - name: Run tests with the native classes
        run: uv run --locked python -m unittest discover -s core/tests -t core

      - name: Run tests with the pure-Python classes
        env:
          TAFLA_PUREPYTHON: "1"
        run: uv run --locked python -m unittest discover -s core/tests -t core

      # And a wheel from the source distribution, as pip builds one where no
      # wheel fits, to check that it builds
      - name: Build the source distribution, and a wheel from it
        run: uv build --package tafla --out-dir "$RUNNER_TEMP/build"

      # uv_build packs the pure-Python sources, from the same pyproject.toml,
      # without the native module
      - name: Build the pure-Python wheel
        working-directory: python/core
        run: uv run --isolated --no-project --with 'uv-build==0.13.7' python -c "import sys, uv_build; print(uv_build.build_wheel(sys.argv[1]))" "$RUNNER_TEMP/build"

      - name: Test the wheels
        run: scripts/test-wheels.sh "$RUNNER_TEMP/build"

      # PyPI rejects the wheel that the source distribution built on the
      # runner, which isn't a manylinux wheel. pypi-wheels builds those.
      - name: Collect the distributions to publish
        run: |
          mkdir "$RUNNER_TEMP/pypi"
          mv "$RUNNER_TEMP"/build/*.tar.gz "$RUNNER_TEMP"/build/*-py3-none-any.whl "$RUNNER_TEMP/pypi/"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-any
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: error

  # Builds the native wheels for a platform, and tests each on its own: abi3
  # for CPython 3.14 and later, cp314t for free-threaded 3.14, and abi3t for
  # 3.15 and later, free-threaded or not. maturin-action builds Linux's in a
  # manylinux or musllinux container, and the others on the runner.
  pypi-wheels:
    name: PyPI (native wheels, ${{ matrix.name }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'python')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Every platform's wheels build, so that one failure shows all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux x86_64, musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: Linux aarch64, musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: python

      # A manylinux container holds the Pythons, which maturin-action puts on
      # the path, and maturin cross-compiles for musl with configurations of
      # its own. On macOS and Windows, maturin builds against the Pythons that
      # uv installs, named by their paths, with forward slashes.
      - name: Choose the Pythons to build against
        id: pythons
        env:
          OS: ${{ runner.os }}
        run: |
          if [[ "$OS" == Linux ]]; then
            {
              echo "abi3=python3.14"
              echo "cp314t=python3.14t"
              echo "abi3t=python3.15t"
            } >> "$GITHUB_OUTPUT"
          else
            uv python install 3.14 3.14t 3.15t
            path_of() {
              local path
              path=$(uv python find --managed-python "$1")
              echo "${path//\\//}"
            }
            {
              echo "abi3=$(path_of 3.14+gil)"
              echo "cp314t=$(path_of 3.14t)"
              echo "abi3t=$(path_of 3.15t)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build the abi3 wheel, for CPython 3.14 and later
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.abi3 }} --features pyo3/abi3-py314

      - name: Build the cp314t wheel, for free-threaded CPython 3.14
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.cp314t }}

      - name: Build the abi3t wheel, for free-threaded CPython 3.15 and later
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.abi3t }} --features pyo3/abi3t-py315

      # musl's run in Alpine, with uv's musl builds of CPython
      - name: Test the wheels
        env:
          MUSL: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          if [[ "$MUSL" == true ]]; then
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
              ghcr.io/astral-sh/uv:0.13.7-alpine scripts/test-wheels.sh dist
          else
            scripts/test-wheels.sh dist
          fi

      - name: Upload the wheels
        uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  # Publishes the distributions that pypi-build and pypi-wheels built and
  # tested
  pypi-publish:
    name: PyPI (publish)
    needs: [plan, pypi-build, pypi-wheels]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tafla/${{ inputs.version }}/
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      # PyPI trusts this workflow as a publisher, pending one for the first
      # release, so the job needs no token
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  # crates.io

  # Checks the Rust workspace, which holds the runtime, tafla, and the
  # generator, tafla-gen, and packages both, for a release of either
  crates-build:
    name: crates.io (check and package)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'rust') || contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache-workspaces: rust -> target
          cache-key: release

      - name: Run formatting check
        run: cargo fmt --all -- --check

      - name: Run lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      # Packages tafla-gen against the tafla that it packages first, rather
      # than one on crates.io, and builds both from their packages
      - name: Package the crates
        run: cargo package --locked -p tafla -p tafla-gen

      - name: Upload the crates
        uses: actions/upload-artifact@v7
        with:
          name: crates
          path: rust/target/package/*.crate
          if-no-files-found: error

  # Publishes the crate of the package that the run releases: tafla, for the
  # Rust runtime, or tafla-gen
  crates-publish:
    name: crates.io (publish)
    needs: [plan, crates-build]
    if: needs.plan.outputs.publish == 'true' && (inputs.package == 'rust' || inputs.package == 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ inputs.package == 'rust' && 'tafla' || 'tafla-gen' }}/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    defaults:
      run:
        working-directory: rust
    env:
      CRATE: ${{ inputs.package == 'rust' && 'tafla' || 'tafla-gen' }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # crates.io can only trust a publisher for a crate that exists, so a
      # CARGO_REGISTRY_TOKEN secret publishes the first release. Without one,
      # the job exchanges its OIDC token for a short-lived one, as the crates'
      # trusted publisher on crates.io allows.
      - name: Check for a registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "present=$([[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Authenticate with trusted publishing
        if: steps.token.outputs.present != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # tafla-gen's tests depend on tafla at the version that its manifest
      # names, which crates.io resolves, so that version of tafla is published
      # first. cargo publish waits until crates.io serves the crate.
      - name: Publish ${{ env.CRATE }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked -p "$CRATE"

  # Maven Central

  maven-build:
    name: Maven Central (check and build)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'java')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle build
        run: ./gradlew build javadoc

      # Publishing requires a signature, so the dry run signs with a key of its
      # own, which nothing trusts, and checks the signatures
      - name: Publish to a local repository, signed with a throwaway key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key "tafla dry run <dry-run@example.invalid>" rsa3072 sign never

          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys)" \
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run \
            ./gradlew :core:publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/maven"

          for signature in "$RUNNER_TEMP"/maven/io/github/snovader/tafla/tafla/*/*.asc; do
            gpg --batch --verify "$signature" "${signature%.asc}"
          done

      - name: Upload the repository
        uses: actions/upload-artifact@v7
        with:
          name: maven
          path: ${{ runner.temp }}/maven/io/github/snovader/tafla/
          if-no-files-found: error

  maven-publish:
    name: Maven Central (publish)
    needs: [plan, maven-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'java'
    runs-on: ubuntu-latest
    # Waits for the Central Portal to validate the deployment
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.snovader.tafla/tafla/${{ inputs.version }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Uploads a signed deployment to the Central Portal, and publishes it
      # once the portal has validated it. Without a key, signing fails rather
      # than publishing unsigned artifacts.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :core:publishToMavenCentral

  # Go module proxy

  go-build:
    name: Go module proxy (check and zip)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'go')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    env:
      # Only the steps that set GOPROXY download modules, so that the others
      # build from what go.mod and go.sum name. They leave -mod at readonly,
      # its default, so that a requirement or a hash that's missing fails
      # rather than being written.
      GOPROXY: "off"
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Without a cache, so that every dependency comes from the proxy, as it
      # will for a module that requires tafla's
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install staticcheck
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      # Checks each download's hash against go.sum, and then that the module
      # cache still holds what was downloaded. The runtime's module requires
      # nothing, and the tests' module requires their library.
      - name: Download and verify the dependencies
        working-directory: go/tests
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download
          go mod verify

      - name: Run formatting check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./...

      # The conformance suite, the property tests and the generated code, in
      # a module of their own
      - name: Run vet on the tests
        working-directory: go/tests
        run: go vet ./...

      - name: Run staticcheck on the tests
        working-directory: go/tests
        run: staticcheck ./...

      - name: Run the tests' module
        working-directory: go/tests
        run: go test ./...

      # The go command builds the module from a tag, as the module proxy will
      # from the pushed one: git fetches https://github.com/snovader/tafla
      # from the checkout, where this step tags the commit without pushing the
      # tag
      - name: Tag the commit in the checkout
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
        run: git tag "go/v$VERSION"

      # In a module that requires tafla's, as a user's would: go get fetches
      # the module from the tag, the files of go/ but tests/ and benchmarks/,
      # modules of their own, then vet checks every package and test in it,
      # and its tests run from the module cache, as go test all runs them for
      # a user. The version isn't in the checksum database yet, so
      # GOPRIVATE fetches it from git and doesn't look it up there, and with
      # GOPROXY off nothing else downloads. -mod=mod lets the go command write
      # the scratch module's go.mod and go.sum.
      - name: Build the module from its tag
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.file://${{ github.workspace }}/.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/snovader/tafla
          GOPRIVATE: github.com/snovader/tafla
          GOFLAGS: -mod=mod
        run: |
          mkdir consumer
          cd consumer
          go mod init example.invalid/consumer
          go get "github.com/snovader/tafla/go@v$VERSION"
          go vet github.com/snovader/tafla/go/...
          go test github.com/snovader/tafla/go/...

      # The files that the proxy will serve for the version
      - name: Copy the module
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
        run: |
          mkdir "$RUNNER_TEMP/go"
          cp "$(go env GOMODCACHE)/cache/download/github.com/snovader/tafla/go/@v/v$VERSION".{info,mod,zip} "$RUNNER_TEMP/go/"
          unzip -l "$RUNNER_TEMP/go/v$VERSION.zip"

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: go
          path: ${{ runner.temp }}/go/
          if-no-files-found: error

  # Pushes the tag that publishes the module, and fetches the module from the
  # proxy, which builds it from the tag, and from the checksum database, which
  # records its hash, as a user's first go get of the version would.
  # pkg.go.dev then lists the version. Unlike an upload, the tag can't be
  # taken back once the proxy has the module, so the job pushes it only once
  # the module has built from it.
  go-publish:
    name: Go module proxy (publish)
    needs: [plan, go-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: go-proxy
      url: https://pkg.go.dev/github.com/snovader/tafla/go@v${{ inputs.version }}
    permissions:
      # Pushes the tag
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Push the tag go/v<version>
        uses: ./.github/actions/release-tag
        with:
          tag: go/v${{ inputs.version }}
          push: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Outside a module, through the proxy and the checksum database that
      # GOPROXY and GOSUMDB name by default
      - name: Fetch the module from the proxy
        working-directory: ${{ runner.temp }}
        run: go mod download -json "github.com/snovader/tafla/go@v$VERSION"

  # Tags the commit that a package was published from <package>/v<version>,
  # once its publish job has succeeded, in a job of its own, so that the jobs
  # that run the registries' tools can't push. Go's publish job pushes its
  # tag itself, since the tag publishes the module.
  tag:
    name: Tag the release
    needs: [plan, npm-publish, pypi-publish, crates-publish, maven-publish]
    # The other packages' publish jobs are skipped, so the job checks the
    # result of the released package's
    if: >-
      !cancelled() && needs.plan.outputs.publish == 'true' && (
        (inputs.package == 'typescript' && needs.npm-publish.result == 'success') ||
        (inputs.package == 'python' && needs.pypi-publish.result == 'success') ||
        (inputs.package == 'java' && needs.maven-publish.result == 'success') ||
        ((inputs.package == 'rust' || inputs.package == 'tafla-gen') && needs.crates-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Pushes the tag
      contents: write
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Push the tag ${{ inputs.package }}/v<version>
        uses: ./.github/actions/release-tag
        with:
          tag: ${{ inputs.package }}/v${{ inputs.version }}
          push: true
