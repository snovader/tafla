name: Release

# Publishes one of tafla's packages, each of which has a version of its own,
# as RELEASING.md describes. A manual run on main names the package and its
# version, checks the package and builds its artifacts, publishes them, and
# then tags the commit <package>/v<version>. Each registry has jobs that check
# its language and build its artifacts, which a dry run uploads to the
# workflow run, and a job that publishes them. The Go module and the Swift
# package are published by their tags, go/v<version> and <version>, which
# their publish jobs push once the package has built from the tag, and from
# which the Go module proxy and SwiftPM build them.
#
# A dry run builds without publishing: a manual run does, unless it's on main
# with dry_run turned off, and so does a pull request, for each package whose
# version it changes, and for every package when it changes the release's own
# files.

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      package:
        description: "The package to release"
        type: choice
        options:
          - typescript
          - python
          - java
          - rust
          - tafla-gen
          - go
          - swift
          - csharp
      version:
        description: "Its version, which must be its manifest's. The Go module and the Swift package record none, so this is their version."
        type: string
        required: true
      dry_run:
        description: "Build the package without publishing it. A run that isn't on main never publishes."
        type: boolean
        default: true

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  # One package's release doesn't wait for another's
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.package }}
  # A release runs to its end, and a pull request's dry run gives way to a newer
  # one
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caches are saved only on main, whose caches every branch restores. A pull
# request's would serve only its own reruns, and would take the place of
# main's in the repository's 10 GB of caches.

jobs:
  # Decides which packages the jobs below build, and whether they publish. It
  # runs on every pull request, so that a package whose manifest and lock files
  # disagree on its version fails.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.dispatch.outputs.packages || steps.pull_request.outputs.packages }}
      publish: ${{ steps.dispatch.outputs.publish || 'false' }}
      go_version: ${{ steps.dispatch.outputs.go_version || steps.pull_request.outputs.go_version }}
      swift_version: ${{ steps.dispatch.outputs.swift_version || steps.pull_request.outputs.swift_version }}
    steps:
      # A pull request's checkout is the merge of its branch into main, which
      # it compares with its first parent, main
      - name: Checkout GitHub repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # A manual run builds the package that it names, and publishes it if
      # it's on main and not a dry run
      - name: Plan a manual run
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$VERSION isn't a version of the form MAJOR.MINOR.PATCH"
            exit 1
          fi

          # The Go module and the Swift package record no version, since their
          # tags are their versions
          if [[ "$PACKAGE" != go && "$PACKAGE" != swift ]]; then
            own=$(scripts/version.sh "$PACKAGE")
            if [[ "$own" != "$VERSION" ]]; then
              echo "::error::The run releases $PACKAGE $VERSION, but $PACKAGE's version is $own"
              exit 1
            fi
          fi

          publish=false
          if [[ "$REF" == refs/heads/main && "$DRY_RUN" == false ]]; then
            publish=true
          fi

          {
            echo "packages=$(jq -cn '$ARGS.positional' --args "$PACKAGE")"
            echo "publish=$publish"
            echo "go_version=$VERSION"
            echo "swift_version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE $VERSION, publish: $publish"

      # A registry rejects a version that it has, so a release whose tag
      # names another commit fails before it builds
      - name: Check the release's tag
        if: steps.dispatch.outputs.publish == 'true'
        uses: ./.github/actions/release-tag
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}

      # A pull request builds each package whose version it changes, which a
      # release of the version would build, and every package when it changes
      # the release's own files. Each package's manifest and lock files must
      # agree on its version.
      - name: Plan a pull request
        if: github.event_name == 'pull_request'
        id: pull_request
        run: |
          # main's files, read with this branch's script
          base="$RUNNER_TEMP/base"
          git worktree add --quiet --detach "$base" HEAD^1
          cp scripts/version.sh "$base/scripts/version.sh"

          packages=()
          for package in typescript python java rust tafla-gen csharp; do
            version=$(scripts/version.sh "$package")
            base_version=$("$base/scripts/version.sh" "$package" 2> /dev/null || true)
            if [[ "$version" != "$base_version" ]]; then
              packages+=("$package")
            fi
          done

          changed=$(git diff --name-only HEAD^1 HEAD)
          touches() {
            local path
            for path in "$@"; do
              if grep -qxF "$path" <<< "$changed"; then
                return 0
              fi
            done
            return 1
          }

          if touches .github/workflows/release.yml .github/actions/release-tag/action.yml scripts/version.sh; then
            packages=(typescript python java rust tafla-gen go swift csharp)
          fi
          if touches python/scripts/test-wheels.sh; then
            packages+=(python)
          fi
          if touches python/gen/pyproject.toml python/scripts/test-gen-wheels.sh; then
            packages+=(tafla-gen)
          fi
          if touches go/go.mod; then
            packages+=(go)
          fi
          # Either of the Swift package's manifests, which its release checks
          # against each other
          if touches Package.swift swift/Package.swift; then
            packages+=(swift)
          fi

          # The Go module has no version until its release names one, so its
          # dry run takes the first of its major version, which go.mod's
          # module path ends with from 2 on
          major=$(sed -nE 's#^module github\.com/snovader/tafla/go/v([0-9]+)$#\1#p' go/go.mod)

          # The Swift package has no version until its release names one
          # either, and its dry run takes 0.0.0
          {
            echo "packages=$(jq -cn '$ARGS.positional' --args "${packages[@]}")"
            echo "go_version=${major:-0}.0.0"
            echo "swift_version=0.0.0"
          } >> "$GITHUB_OUTPUT"
          echo "Packages: ${packages[*]:-none}"

  # npm

  npm-build:
    name: npm (check and pack)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'typescript')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Run format check
        run: yarn format:check

      - name: Run lint check
        run: yarn lint:check

      - name: Run type check
        run: yarn typecheck

      - name: Check the package
        run: yarn package:check

      - name: Run tests
        run: yarn test

      - name: Pack the package
        run: yarn workspace tafla pack --out "$RUNNER_TEMP/npm/%s-%v.tgz"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error

  npm-publish:
    name: npm (publish)
    needs: [plan, npm-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/tafla/v/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing and provenance
      id-token: write
    defaults:
      run:
        working-directory: typescript/core
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      # Yarn exchanges the workflow's OIDC token for one that publishes, as
      # the package's trusted publisher on npm allows. npm can only trust a
      # publisher for a package that exists, so an NPM_TOKEN secret, if set,
      # publishes instead, as the first release needs.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            export YARN_NPM_AUTH_TOKEN="$NPM_TOKEN"
          fi
          yarn npm publish --provenance --access public

  # Builds the generator's WebAssembly module and @tafla/gen, the npm package
  # that runs it, checks the package's command and API against the build, and
  # packs it. The TypeScript workflow formats, lints and type-checks it.
  npm-gen-build:
    name: npm (check and pack @tafla/gen)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      - name: Build the package and run its tests
        run: yarn test:gen

      - name: Pack the package
        run: yarn workspace @tafla/gen pack --out "$RUNNER_TEMP/npm-gen/%s-%v.tgz"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: npm-gen
          path: ${{ runner.temp }}/npm-gen/
          if-no-files-found: error

  npm-gen-publish:
    name: npm (publish @tafla/gen)
    needs: [plan, npm-gen-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'tafla-gen'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tafla/gen/v/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing and provenance
      id-token: write
    defaults:
      run:
        working-directory: typescript/gen
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Publishing packs the package, which builds the generator's module
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Prepare dependencies
        uses: ./.github/actions/prepare-node-dependencies

      # As the runtime's package is published, with a trusted publisher or,
      # for the first release, an NPM_TOKEN secret
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            export YARN_NPM_AUTH_TOKEN="$NPM_TOKEN"
          fi
          yarn npm publish --provenance --access public

  # PyPI

  # Checks both implementations of the Python runtime, and builds the
  # distributions that install anywhere: the source distribution, which builds
  # the native classes with Rust, and the pure-Python wheel, which pip installs
  # where no native wheel fits
  pypi-build:
    name: PyPI (check and build)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'python')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Rust builds the native classes, which uv installs with the workspace
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: python/core/native -> target
          cache-key: release

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          python-version: "3.14"
          working-directory: python

      - name: Run format check
        run: uv run --locked ruff format --check

      - name: Run lint check
        run: uv run --locked ruff check

      - name: Run type check
        run: uv run --locked ty check

      - name: Run format check of the native classes
        working-directory: python/core/native
        run: cargo fmt --check

      - name: Run lint check of the native classes
        working-directory: python/core/native
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo clippy --all-targets -- -D warnings

      - name: Run the native classes' Rust tests
        working-directory: python/core/native
        run: PYO3_PYTHON="$(uv python find 3.14)" cargo test

      - name: Run tests with the native classes
        run: uv run --locked python -m unittest discover -s core/tests -t core

      - name: Run tests with the pure-Python classes
        env:
          TAFLA_PUREPYTHON: "1"
        run: uv run --locked python -m unittest discover -s core/tests -t core

      # And a wheel from the source distribution, as pip builds one where no
      # wheel fits, to check that it builds
      - name: Build the source distribution, and a wheel from it
        run: uv build --package tafla --out-dir "$RUNNER_TEMP/build"

      # uv_build packs the pure-Python sources, from the same pyproject.toml,
      # without the native module
      - name: Build the pure-Python wheel
        working-directory: python/core
        run: uv run --isolated --no-project --with 'uv-build==0.13.7' python -c "import sys, uv_build; print(uv_build.build_wheel(sys.argv[1]))" "$RUNNER_TEMP/build"

      - name: Test the wheels
        run: scripts/test-wheels.sh "$RUNNER_TEMP/build"

      # PyPI rejects the wheel that the source distribution built on the
      # runner, which isn't a manylinux wheel. pypi-wheels builds those.
      - name: Collect the distributions to publish
        run: |
          mkdir "$RUNNER_TEMP/pypi"
          mv "$RUNNER_TEMP"/build/*.tar.gz "$RUNNER_TEMP"/build/*-py3-none-any.whl "$RUNNER_TEMP/pypi/"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-any
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: error

  # Builds the native wheels for a platform, and tests each on its own: abi3
  # for CPython 3.14 and later, cp314t for free-threaded 3.14, and abi3t for
  # 3.15 and later, free-threaded or not. maturin-action builds Linux's in a
  # manylinux or musllinux container, and the others on the runner.
  pypi-wheels:
    name: PyPI (native wheels, ${{ matrix.name }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'python')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Every platform's wheels build, so that one failure shows all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux x86_64, musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: Linux aarch64, musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          working-directory: python

      # A manylinux container holds the Pythons, which maturin-action puts on
      # the path, and maturin cross-compiles for musl with configurations of
      # its own. On macOS and Windows, maturin builds against the Pythons that
      # uv installs, named by their paths, with forward slashes.
      - name: Choose the Pythons to build against
        id: pythons
        env:
          OS: ${{ runner.os }}
        run: |
          if [[ "$OS" == Linux ]]; then
            {
              echo "abi3=python3.14"
              echo "cp314t=python3.14t"
              echo "abi3t=python3.15t"
            } >> "$GITHUB_OUTPUT"
          else
            uv python install 3.14 3.14t 3.15t
            path_of() {
              local path
              path=$(uv python find --managed-python "$1")
              echo "${path//\\//}"
            }
            {
              echo "abi3=$(path_of 3.14+gil)"
              echo "cp314t=$(path_of 3.14t)"
              echo "abi3t=$(path_of 3.15t)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build the abi3 wheel, for CPython 3.14 and later
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.abi3 }} --features pyo3/abi3-py314

      - name: Build the cp314t wheel, for free-threaded CPython 3.14
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.cp314t }}

      - name: Build the abi3t wheel, for free-threaded CPython 3.15 and later
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../dist --interpreter ${{ steps.pythons.outputs.abi3t }} --features pyo3/abi3t-py315

      # musl's run in Alpine, with uv's musl builds of CPython
      - name: Test the wheels
        env:
          MUSL: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          if [[ "$MUSL" == true ]]; then
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
              ghcr.io/astral-sh/uv:0.13.7-alpine scripts/test-wheels.sh dist
          else
            scripts/test-wheels.sh dist
          fi

      - name: Upload the wheels
        uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  # Publishes the distributions that pypi-build and pypi-wheels built and
  # tested
  pypi-publish:
    name: PyPI (publish)
    needs: [plan, pypi-build, pypi-wheels]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tafla/${{ inputs.version }}/
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      # PyPI trusts this workflow as a publisher, pending one for the first
      # release, so the job needs no token
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  # tafla-gen's distribution on PyPI holds the generator's command, the binary
  # of the crate in rust/gen, without any Python. crates-build checks the
  # crate.

  # Builds the source distribution, and a wheel from it, as pip builds one
  # where no wheel fits, to check that it builds
  pypi-gen-build:
    name: PyPI (tafla-gen, build)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python/gen
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Without a cache, since the wheel builds from the source distribution,
      # in a directory of uv's
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Build the source distribution, and a wheel from it
        run: uv build --out-dir "$RUNNER_TEMP/build"

      - name: Test the wheel
        run: ../scripts/test-gen-wheels.sh "$RUNNER_TEMP/build"

      # PyPI rejects the wheel that the source distribution built on the
      # runner, which isn't a manylinux wheel. pypi-gen-wheels builds those.
      - name: Upload the source distribution
        uses: actions/upload-artifact@v7
        with:
          name: tafla-gen-pypi-sdist
          path: ${{ runner.temp }}/build/*.tar.gz
          if-no-files-found: error

  # Builds the wheel that holds the command for a platform, with the Rust
  # workspace's lock file, and tests it. One wheel serves every Python, since
  # the command links none. maturin-action builds Linux's in a manylinux or
  # musllinux container, and the others on the runner.
  pypi-gen-wheels:
    name: PyPI (tafla-gen, wheel, ${{ matrix.name }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Every platform's wheel builds, so that one failure shows all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - name: Linux x86_64, musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: Linux aarch64, musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: python/gen
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      # musl's runs in Alpine
      - name: Test the wheel
        env:
          MUSL: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          if [[ "$MUSL" == true ]]; then
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" \
              ghcr.io/astral-sh/uv:0.13.7-alpine scripts/test-gen-wheels.sh gen/dist
          else
            scripts/test-gen-wheels.sh gen/dist
          fi

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: tafla-gen-pypi-wheel-${{ matrix.target }}
          path: python/gen/dist/*.whl
          if-no-files-found: error

  # Publishes the distributions that pypi-gen-build and pypi-gen-wheels built
  # and tested, in a release of tafla-gen, beside crates-publish
  pypi-gen-publish:
    name: PyPI (tafla-gen, publish)
    needs: [plan, pypi-gen-build, pypi-gen-wheels]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'tafla-gen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tafla-gen/${{ inputs.version }}/
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          pattern: tafla-gen-pypi-*
          merge-multiple: true
          path: dist

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      # PyPI trusts this workflow as a publisher, pending one for the first
      # release, so the job needs no token
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  # crates.io

  # Checks the Rust workspace, which holds the runtime, tafla, and the
  # generator, tafla-gen, and packages both, for a release of either
  crates-build:
    name: crates.io (check and package)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'rust') || contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: release

      # The crates that it packages, rather than the workspace, whose
      # benchmarks bring the libraries that they compare tafla with, and
      # those libraries' build scripts and macros, which have no part in
      # building the crates: the Rust workflow checks those.
      - name: Run formatting check
        run: cargo fmt -p tafla -p tafla-gen -- --check

      - name: Run lint check
        run: cargo clippy -p tafla -p tafla-gen --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test -p tafla -p tafla-gen

      # Packages tafla-gen against the tafla that it packages first, rather
      # than one on crates.io, and builds both from their packages
      - name: Package the crates
        run: cargo package --locked -p tafla -p tafla-gen

      - name: Upload the crates
        uses: actions/upload-artifact@v7
        with:
          name: crates
          path: rust/target/package/*.crate
          if-no-files-found: error

  # Publishes the crate of the package that the run releases: tafla, for the
  # Rust runtime, or tafla-gen
  crates-publish:
    name: crates.io (publish)
    needs: [plan, crates-build]
    if: needs.plan.outputs.publish == 'true' && (inputs.package == 'rust' || inputs.package == 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ inputs.package == 'rust' && 'tafla' || 'tafla-gen' }}/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    defaults:
      run:
        working-directory: rust
    env:
      CRATE: ${{ inputs.package == 'rust' && 'tafla' || 'tafla-gen' }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # crates.io can only trust a publisher for a crate that exists, so a
      # CARGO_REGISTRY_TOKEN secret publishes the first release. Without one,
      # the job exchanges its OIDC token for a short-lived one, as the crates'
      # trusted publisher on crates.io allows.
      - name: Check for a registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "present=$([[ -n "$CARGO_REGISTRY_TOKEN" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Authenticate with trusted publishing
        if: steps.token.outputs.present != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # tafla-gen's tests depend on tafla at the version that its manifest
      # names, which crates.io resolves, so that version of tafla is published
      # first. cargo publish waits until crates.io serves the crate.
      - name: Publish ${{ env.CRATE }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked -p "$CRATE"

  # Maven Central

  maven-build:
    name: Maven Central (check and build)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'java')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The library's project, rather than the build, whose benchmarks bring
      # the libraries that they compare tafla with, and generate and compile
      # their code, which has no part in building the library: the Java
      # workflow checks those. Gradle still configures the benchmarks'
      # project, and so loads its plugins, but runs none of its tasks.
      - name: Run Gradle build
        run: ./gradlew :core:build :core:javadoc

      # Publishing requires a signature, so the dry run signs with a key of its
      # own, which nothing trusts, and checks the signatures
      - name: Publish to a local repository, signed with a throwaway key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key "tafla dry run <dry-run@example.invalid>" rsa3072 sign never

          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys)" \
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run \
            ./gradlew :core:publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/maven"

          for signature in "$RUNNER_TEMP"/maven/io/github/snovader/tafla/tafla/*/*.asc; do
            gpg --batch --verify "$signature" "${signature%.asc}"
          done

      - name: Upload the repository
        uses: actions/upload-artifact@v7
        with:
          name: maven
          path: ${{ runner.temp }}/maven/io/github/snovader/tafla/
          if-no-files-found: error

  maven-publish:
    name: Maven Central (publish)
    needs: [plan, maven-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'java'
    runs-on: ubuntu-latest
    # Waits for the Central Portal to validate the deployment
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.snovader.tafla/tafla/${{ inputs.version }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Uploads a signed deployment to the Central Portal, and publishes it
      # once the portal has validated it. Without a key, signing fails rather
      # than publishing unsigned artifacts.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :core:publishToMavenCentral

  # Builds the generator's WebAssembly module and the jar that runs it,
  # compiled to classes of the JVM, runs the jar's command against the
  # generator's golden files, and publishes it to a local repository
  maven-gen-build:
    name: Maven Central (check and build tafla-gen)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle build
        run: ./gradlew :gen:build :gen:javadoc

      # As the runtime's dry run: signed with a key of its own, which nothing
      # trusts, and its signatures checked
      - name: Publish to a local repository, signed with a throwaway key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase dry-run \
            --quick-gen-key "tafla dry run <dry-run@example.invalid>" rsa3072 sign never

          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback --passphrase dry-run --armor --export-secret-keys)" \
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=dry-run \
            ./gradlew :gen:publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/maven"

          for signature in "$RUNNER_TEMP"/maven/io/github/snovader/tafla/tafla-gen/*/*.asc; do
            gpg --batch --verify "$signature" "${signature%.asc}"
          done

      - name: Upload the repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-gen
          path: ${{ runner.temp }}/maven/io/github/snovader/tafla/
          if-no-files-found: error

  maven-gen-publish:
    name: Maven Central (publish tafla-gen)
    needs: [plan, maven-gen-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'tafla-gen'
    runs-on: ubuntu-latest
    # Waits for the Central Portal to validate the deployment
    timeout-minutes: 60
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.snovader.tafla/tafla-gen/${{ inputs.version }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Publishing builds the jar, which builds the generator's module
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # As the runtime is published, with the same account and key
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :gen:publishToMavenCentral

  # Go module proxy

  go-build:
    name: Go module proxy (check and zip)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'go')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    env:
      # Only the steps that set GOPROXY download modules, so that the others
      # build from what go.mod and go.sum name. They leave -mod at readonly,
      # its default, so that a requirement or a hash that's missing fails
      # rather than being written.
      GOPROXY: "off"
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # Without a cache, so that every dependency comes from the proxy, as it
      # will for a module that requires tafla's
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install staticcheck
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      # Checks each download's hash against go.sum, and then that the module
      # cache still holds what was downloaded. The runtime's module requires
      # nothing, and the tests' module requires their library.
      - name: Download and verify the dependencies
        working-directory: go/tests
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download
          go mod verify

      - name: Run formatting check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./...

      # The conformance suite, the property tests and the generated code, in
      # a module of their own
      - name: Run vet on the tests
        working-directory: go/tests
        run: go vet ./...

      - name: Run staticcheck on the tests
        working-directory: go/tests
        run: staticcheck ./...

      - name: Run the tests' module
        working-directory: go/tests
        run: go test ./...

      # The go command builds the module from a tag, as the module proxy will
      # from the pushed one: git fetches https://github.com/snovader/tafla
      # from the checkout, where this step tags the commit without pushing the
      # tag
      - name: Tag the commit in the checkout
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
        run: git tag "go/v$VERSION"

      # In a module that requires tafla's, as a user's would: go get fetches
      # the module from the tag, the files of go/ but tests/ and benchmarks/,
      # modules of their own, then vet checks every package and test in it,
      # and its tests run from the module cache, as go test all runs them for
      # a user. The version isn't in the checksum database yet, so
      # GOPRIVATE fetches it from git and doesn't look it up there, and with
      # GOPROXY off nothing else downloads. -mod=mod lets the go command write
      # the scratch module's go.mod and go.sum.
      - name: Build the module from its tag
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.file://${{ github.workspace }}/.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/snovader/tafla
          GOPRIVATE: github.com/snovader/tafla
          GOFLAGS: -mod=mod
        run: |
          mkdir consumer
          cd consumer
          go mod init example.invalid/consumer
          go get "github.com/snovader/tafla/go@v$VERSION"
          go vet github.com/snovader/tafla/go/...
          go test github.com/snovader/tafla/go/...

      # The files that the proxy will serve for the version
      - name: Copy the module
        env:
          VERSION: ${{ needs.plan.outputs.go_version }}
        run: |
          mkdir "$RUNNER_TEMP/go"
          cp "$(go env GOMODCACHE)/cache/download/github.com/snovader/tafla/go/@v/v$VERSION".{info,mod,zip} "$RUNNER_TEMP/go/"
          unzip -l "$RUNNER_TEMP/go/v$VERSION.zip"

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: go
          path: ${{ runner.temp }}/go/
          if-no-files-found: error

  # Pushes the tag that publishes the module, and fetches the module from the
  # proxy, which builds it from the tag, and from the checksum database, which
  # records its hash, as a user's first go get of the version would.
  # pkg.go.dev then lists the version. Unlike an upload, the tag can't be
  # taken back once the proxy has the module, so the job pushes it only once
  # the module has built from it.
  go-publish:
    name: Go module proxy (publish)
    needs: [plan, go-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: go-proxy
      url: https://pkg.go.dev/github.com/snovader/tafla/go@v${{ inputs.version }}
    permissions:
      # Pushes the tag
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Push the tag go/v<version>
        uses: ./.github/actions/release-tag
        with:
          package: go
          version: ${{ inputs.version }}
          push: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # Outside a module, through the proxy and the checksum database that
      # GOPROXY and GOSUMDB name by default
      - name: Fetch the module from the proxy
        working-directory: ${{ runner.temp }}
        run: go mod download -json "github.com/snovader/tafla/go@v$VERSION"

  # Swift package

  # Checks the Swift package, on Linux with the Swift of its tools version and
  # the latest release, and on macOS, and builds it from a tag, as a
  # dependency of a package that requires it. SwiftPM resolves a package from
  # the manifest at the root of its repository, which declares the library of
  # swift/ alone, so the job checks it against swift/Package.swift, from which
  # the package is tested.
  swift-build:
    name: Swift package (check and build, ${{ matrix.name }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'swift')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # None on macOS
    container: ${{ matrix.container }}
    strategy:
      # Every platform builds, so that one failure shows all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux, Swift 6.2
            runner: ubuntu-latest
            container: swift:6.2-noble
          - name: Linux, Swift 6.4
            runner: ubuntu-latest
            container: swift:6.4-noble
            # The Swift workflow's swift-format, whose versions format alike
            # only mostly
            format: true
          - name: macOS
            runner: macos-26
    defaults:
      run:
        working-directory: swift
    env:
      VERSION: ${{ needs.plan.outputs.swift_version }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # A container runs as another user than the one that owns the checkout,
      # whose repository git then refuses to read, to tag or to clone from
      - name: Trust the checkout
        if: matrix.container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"

      - name: Print the Swift version
        run: swift --version

      - name: Run formatting check
        if: matrix.format
        run: |
          swift format lint --strict --recursive Package.swift Sources Tests
          swift format lint --strict --configuration .swift-format ../Package.swift

      # The library that the root's manifest declares, with the products and
      # platforms that a package that depends on it sees, must be the one that
      # swift/Package.swift declares and the tests test. jq is on the macOS
      # runner, rather than in the Swift images.
      - name: Check the root's manifest against the package's
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          library() {
            swift package --package-path "$1" dump-package |
              jq -S 'del(.packageKind, .dependencies)
                | .products |= map(select(.type | has("library")))
                | .targets |= map(select(.name == "Tafla") | del(.path))'
          }
          diff -u <(library swift) <(library .)

      - name: Run tests
        run: swift test

      - name: Run tests optimized
        run: swift test -c release -Xswiftc -enable-testing

      - name: Run tests of the portable path
        if: runner.os == 'Linux'
        run: swift test --scratch-path .build/portable -Xswiftc -DTAFLA_PORTABLE

      - name: Build for a 32-bit target
        if: runner.os == 'macOS'
        run: |
          swift build --scratch-path .build/watchos --target Tafla \
              --triple arm64_32-apple-watchos9.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

      # SwiftPM builds the package from a tag, as it will from the pushed one:
      # git fetches https://github.com/snovader/tafla.git from the checkout,
      # where this step tags the commit without pushing the tag
      - name: Tag the commit in the checkout
        run: git tag "$VERSION"

      # In a package that depends on tafla's by its URL, as a user's would, and
      # on macOS from the earliest macOS that it supports: SwiftPM resolves the
      # version from the tag and loads the root's manifest, which the shallow
      # checkout holds, and the package builds the library, writes a table and
      # reads it back
      - name: Build the package from its tag
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/Sources/Consumer"
          cd "$RUNNER_TEMP/consumer"

          cat > Package.swift <<EOF
          // swift-tools-version:6.2

          import PackageDescription

          let package = Package(
              name: "consumer",
              platforms: [.macOS(.v12)],
              dependencies: [
                  .package(url: "https://github.com/snovader/tafla.git", exact: "$VERSION")
              ],
              targets: [
                  .executableTarget(name: "Consumer", dependencies: [.product(name: "Tafla", package: "tafla")])
              ]
          )
          EOF

          cat > Sources/Consumer/main.swift <<'EOF'
          import Tafla

          func readBack() throws {
              var builder = try TableBuilder(fields: 2)
              try builder.setString("Europe/Stockholm")
              try builder.setFloat32Array([21.75, 18.5])
              let bytes = try builder.bytes()[...]

              let reader = TableReader(bytes.span.bytes)
              let timeZone = try reader.string(at: reader.rootOffset(0))
              let values = Array(try reader.float32Array(at: reader.rootOffset(1)))
              precondition(timeZone == "Europe/Stockholm" && values == [21.75, 18.5])
          }

          try readBack()
          EOF

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.file://$GITHUB_WORKSPACE/.git.insteadOf"
          export GIT_CONFIG_VALUE_0=https://github.com/snovader/tafla.git
          swift run Consumer

  # Pushes the tag that publishes the package, <version>, from which SwiftPM
  # resolves it, and resolves it from GitHub, as a user's package would. Unlike
  # an upload, the tag can't be taken back once a package has resolved it, since
  # SwiftPM records the commit of each version that it resolves, so the job
  # pushes it only once the package has built from it.
  swift-publish:
    name: Swift package (publish)
    needs: [plan, swift-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'swift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.4-noble
    environment:
      name: swift-package
      url: https://github.com/snovader/tafla/tree/${{ inputs.version }}
    permissions:
      # Pushes the tag
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # The container runs as another user than the one that owns the checkout
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Push the tag <version>
        uses: ./.github/actions/release-tag
        with:
          package: swift
          version: ${{ inputs.version }}
          push: true

      - name: Resolve the package from GitHub
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > Package.swift <<EOF
          // swift-tools-version:6.2

          import PackageDescription

          let package = Package(
              name: "consumer",
              dependencies: [
                  .package(url: "https://github.com/snovader/tafla.git", exact: "$VERSION")
              ]
          )
          EOF
          swift package resolve

  # NuGet

  # Checks the C# runtime, packs it, with its symbols in a .snupkg, and tests
  # the package as a project that uses it would, as the C# workflow does. It
  # checks the runtime and its tests by their projects rather than the
  # solution, whose other projects, such as the benchmarks, bring packages
  # and their source generators that have no part in building the package:
  # the C# workflow checks those.
  nuget-build:
    name: NuGet (check and pack)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csharp
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "true"
      # Restores the tests' packages as their lock file locks them, and maps
      # the paths that the assembly and its symbols record, so that the commit
      # builds the same assembly wherever the same SDK builds it
      ContinuousIntegrationBuild: "true"
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run formatting check
        run: |
          dotnet format src/Tafla --verify-no-changes
          dotnet format tests/Tafla.Tests --verify-no-changes

      # The tests' project builds the runtime and the generated code that it
      # tests
      - name: Build
        run: dotnet build tests/Tafla.Tests

      - name: Run tests
        run: dotnet test --no-build --project tests/Tafla.Tests

      - name: Run tests of the portable path
        run: dotnet test -p:TaflaPortable=true --project tests/Tafla.Tests

      - name: Pack the package
        run: dotnet pack src/Tafla

      - name: Test the package
        run: scripts/test-package.sh

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: csharp/artifacts/package/release/
          if-no-files-found: error

  # Publishes the package, and its symbols, that nuget-build built and tested
  nuget-publish:
    name: NuGet (publish)
    needs: [plan, nuget-build]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'csharp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Tafla/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Exchanges the workflow's OIDC token for an API key that lasts an hour,
      # as the trusted publishing policy on nuget.org allows, which can publish
      # a package's first version too. The key is the policy's owner's, whose
      # nuget.org user name is the NUGET_USER secret, so the job needs no
      # API key.
      - name: Authenticate with trusted publishing
        id: auth
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg beside the package too. A version that nuget.org
      # has fails, as on the other registries, but an attempt that runs the
      # job again skips what an earlier attempt pushed, such as the package
      # once its symbols failed.
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          options=()
          if ((RUN_ATTEMPT > 1)); then
            options+=(--skip-duplicate)
          fi
          dotnet nuget push "nuget/Tafla.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json "${options[@]}"

  # Builds the tafla-gen command that the package Tafla.Gen packs for a host,
  # on a runner of the host, and runs it there. Linux's are built for musl,
  # which links them statically, and run in Alpine too.
  nuget-gen-commands:
    name: NuGet (tafla-gen for ${{ matrix.host }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Every host's command builds, so that one failure shows all of them
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - host: osx-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - host: osx-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - host: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - host: win-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
        working-directory: csharp
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: nuget-gen-${{ matrix.target }}
          # scripts/build-gen.sh sets the flags of the build
          rustflags: ""

      - name: Build the command
        env:
          TARGET: ${{ matrix.target }}
          HOST: ${{ matrix.host }}
        run: |
          host=$(scripts/build-gen.sh "$TARGET")
          if [[ "$host" != "$HOST" ]]; then
            echo "::error::scripts/build-gen.sh built $TARGET for $host, not $HOST"
            exit 1
          fi

      - name: Run the command
        env:
          HOST: ${{ matrix.host }}
        run: |
          "artifacts/tafla-gen/$HOST/tafla-gen" --version
          if [[ "$HOST" == linux-* ]]; then
            docker run --rm -v "$PWD/artifacts/tafla-gen/$HOST:/tafla-gen:ro" alpine:3 /tafla-gen/tafla-gen --version
          fi

      - name: Upload the command
        uses: actions/upload-artifact@v7
        with:
          name: nuget-gen-command-${{ matrix.host }}
          path: csharp/artifacts/tafla-gen/
          if-no-files-found: error

  # Packs Tafla.Gen with every host's command, and the runtime's package,
  # whose API the generated code calls, and tests Tafla.Gen as a project that
  # uses it would
  nuget-gen-build:
    name: NuGet (pack Tafla.Gen)
    needs: [plan, nuget-gen-commands]
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: csharp
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ContinuousIntegrationBuild: "true"
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download the commands
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-gen-command-*
          path: csharp/artifacts/tafla-gen
          merge-multiple: true

      # Fails unless every host has its command
      - name: Pack the packages
        run: |
          dotnet pack src/Tafla
          dotnet pack src/Tafla.Gen

      - name: Test the package
        run: scripts/test-gen-package.sh

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-gen
          path: csharp/artifacts/package/release/*.nupkg
          if-no-files-found: error

  # Tests the package on each other host whose command it holds, as
  # nuget-gen-build tested it on Linux x64, so that a project there finds its
  # host's command and runs it
  nuget-gen-test:
    name: NuGet (test Tafla.Gen on ${{ matrix.host }})
    needs: [plan, nuget-gen-build]
    if: contains(fromJSON(needs.plan.outputs.packages), 'tafla-gen')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: osx-arm64
            runner: macos-latest
          - host: osx-x64
            runner: macos-15-intel
          - host: win-x64
            runner: windows-latest
          - host: win-arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: bash
        working-directory: csharp
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-gen
          path: csharp/artifacts/package/release

      - name: Test the package
        run: scripts/test-gen-package.sh

  # Publishes the package Tafla.Gen that nuget-gen-build packed and every host
  # tested, for a release of tafla-gen, as nuget-publish publishes the
  # runtime's
  nuget-gen-publish:
    name: NuGet (publish Tafla.Gen)
    needs: [plan, nuget-gen-build, nuget-gen-test]
    if: needs.plan.outputs.publish == 'true' && inputs.package == 'tafla-gen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Tafla.Gen/${{ inputs.version }}
    permissions:
      contents: read
      # Trusted publishing
      id-token: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-gen
          path: nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate with trusted publishing
        id: auth
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # An attempt that runs the job again skips a package that an earlier
      # attempt pushed
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          options=()
          if ((RUN_ATTEMPT > 1)); then
            options+=(--skip-duplicate)
          fi
          dotnet nuget push "nuget/Tafla.Gen.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json "${options[@]}"

  # Tags the commit that a package was published from <package>/v<version>,
  # once its publish job has succeeded, in a job of its own, so that the jobs
  # that run the registries' tools can't push. Go's and Swift's publish jobs
  # push their tags themselves, since a tag publishes each.
  tag:
    name: Tag the release
    needs: [plan, npm-publish, npm-gen-publish, pypi-publish, pypi-gen-publish, crates-publish, maven-publish, maven-gen-publish, nuget-publish, nuget-gen-publish]
    # The other packages' publish jobs are skipped, so the job checks the
    # result of the released package's, and of each registry's for tafla-gen
    if: >-
      !cancelled() && needs.plan.outputs.publish == 'true' && (
        (inputs.package == 'typescript' && needs.npm-publish.result == 'success') ||
        (inputs.package == 'python' && needs.pypi-publish.result == 'success') ||
        (inputs.package == 'java' && needs.maven-publish.result == 'success') ||
        (inputs.package == 'rust' && needs.crates-publish.result == 'success') ||
        (inputs.package == 'tafla-gen' && needs.crates-publish.result == 'success' && needs.npm-gen-publish.result == 'success' && needs.pypi-gen-publish.result == 'success' && needs.maven-gen-publish.result == 'success' && needs.nuget-gen-publish.result == 'success') ||
        (inputs.package == 'csharp' && needs.nuget-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Pushes the tag
      contents: write
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Push the tag ${{ inputs.package }}/v<version>
        uses: ./.github/actions/release-tag
        with:
          package: ${{ inputs.package }}
          version: ${{ inputs.version }}
          push: true
