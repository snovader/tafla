name: Go

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - ".github/workflows/go.yml"
              - "conformance/**"
              - "go/**"

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # gofmt lists the files that it would change, in every module
      - name: Run formatting check
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go/tests/go.sum
            go/benchmarks/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      # The tests are a module of their own, so that the runtime's module
      # needs none of their libraries nor the repository's files
      - name: Run vet on the tests
        working-directory: go/tests
        run: go vet ./...

      - name: Run staticcheck on the tests
        working-directory: go/tests
        run: staticcheck ./...

      # The benchmarks are a module of their own, so that the runtime's
      # module needs none of their libraries
      - name: Run vet on the benchmarks
        working-directory: go/benchmarks
        run: go vet ./...

      - name: Run staticcheck on the benchmarks
        working-directory: go/benchmarks
        run: staticcheck ./...

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The latest release, and the module's go directive
        go: [stable, "1.23"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/tests/go.sum

      # The runtime's examples, with the race detector, which checkptr's
      # checks of unsafe pointers come with
      - name: Run the runtime's tests with the race detector
        run: go test -race ./...

      # The conformance suite, the property tests and the code that
      # tafla-gen generates
      - name: Run tests with the race detector
        working-directory: go/tests
        run: go test -race ./...

      # Reads and writes every array element by element, as on a big-endian
      # host, rather than in place
      - name: Run tests of the portable path
        working-directory: go/tests
        run: go test -tags tafla_portable ./...

  # A big-endian host, which reads and writes every array through its
  # byte-swapping path, and a 32-bit one, where an int doesn't hold every
  # uint32 offset
  architectures:
    name: Test (${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: s390x
            emulator: qemu-s390x
          - goarch: "386"
            # Linux on amd64 runs 386 binaries natively
            emulator: ""
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/tests/go.sum

      - name: Install qemu
        if: matrix.emulator != ''
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends qemu-user

      # Each package's tests, compiled for the architecture in the package's
      # directory, which picks its module, and run there
      - name: Run tests
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          for package in . tests tests/generated; do
            (cd "$package" && go test -c -o "$RUNNER_TEMP/tafla.test" . && ${{ matrix.emulator }} "$RUNNER_TEMP/tafla.test")
          done

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go/tests
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzByteBuffer, FuzzConformance]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/tests/go.sum

      # Briefly, from the conformance suite's tables, so that a change that
      # breaks a target, or that it finds quickly, fails here. Go writes a
      # failing input to testdata/fuzz, which the step uploads.
      - name: Run the fuzz target
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s .

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: go/tests/testdata/fuzz

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go/benchmarks
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/benchmarks/go.sum

      # The workloads' values, and that every codec reads back what it wrote
      - name: Run tests
        run: go test ./...

      # Shared runners are too noisy for the numbers to mean much; this run
      # checks that the benchmarks work
      - name: Run benchmarks briefly
        run: go run ./cmd/comparison -quick

      - name: Print the encoded sizes
        run: go run ./cmd/encoding
