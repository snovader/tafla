name: Rust

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Read-only, unless a job asks for more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

# Caches are saved only on main, whose caches every branch restores. A pull
# request's would serve only its own reruns, and would take the place of
# main's in the repository's 10 GB of caches.

jobs:
  # Every push and pull request runs this workflow, so that its required check
  # always reports, and the jobs below run only when the change touches these
  # paths
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      # A pull request lists its files through the API, and a push compares
      # its commits, which needs the repository
      - name: Checkout GitHub repo
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - ".github/actions/prepare-node-environment/action.yml"
              - ".github/workflows/rust.yml"
              - "conformance/**"
              - "rust/**"
              - "schemas/**"
              # The generator's golden files of the other targets, in their
              # languages' test trees, and not the tests beside them
              - "cpp/tests/generated/*/**"
              - "go/tests/generated/*/**"
              - "java/core/src/test/java/io/github/snovader/tafla/test/generated/*/**"
              - "python/core/tests/generated/*/**"
              - "typescript/core/test/generated/*/**"
              # The other comparison suites' schemas and generated code
              - "cpp/benchmarks/workloads.tafla"
              - "cpp/benchmarks/generated/tafla/**"
              - "go/benchmarks/workloads.tafla"
              - "go/benchmarks/generated/tafla/**"
              - "java/benchmarks/src/main/tafla/workloads.tafla"
              - "java/benchmarks/src/main/java/io/github/snovader/tafla/benchmarks/generated/tafla/**"
              - "python/benchmarks/src/tafla_benchmarks/generated/workloads.tafla"
              - "python/benchmarks/src/tafla_benchmarks/generated/tafla/**"
              - "typescript/benchmarks/comparison/workloads.tafla"
              - "typescript/benchmarks/comparison/generated/tafla/**"
            # The runtime and what its tests read, which the jobs that test only
            # the runtime, under Miri and on a 32-bit target, run for
            runtime:
              - ".github/workflows/rust.yml"
              - "conformance/**"
              - "rust/Cargo.lock"
              - "rust/Cargo.toml"
              - "rust/core/**"
              - "rust/rust-toolchain.toml"

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false

      - name: Run formatting check
        run: cargo fmt --all -- --check

      # The fuzz targets are a workspace of their own, which the fuzz workflow
      # builds weekly
      - name: Run formatting check of the fuzz targets
        run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: |
            rust -> target
            rust/fuzz -> target

      - name: Run lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      # On stable, without cargo-fuzz's instrumentation, so that a change to
      # the runtime or the generator that breaks the fuzz targets fails here
      # rather than in the weekly fuzz workflow
      - name: Run lint check of the fuzz targets
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        # stable, and the workspace's rust-version
        toolchain: ["stable", "1.88"]
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: ${{ matrix.toolchain }}

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test

  miri:
    name: Test (${{ matrix.name }}, Miri)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          # Checks the runtime's unsafe code for undefined behavior, with
          # arrays read in place where they're aligned
          - name: host
            target: x86_64-unknown-linux-gnu
          # Reads every array through its byte-swapping path
          - name: big-endian
            target: powerpc-unknown-linux-gnu
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      # With the sysroot that Miri builds for the target
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: miri, rust-src
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-directories: ~/.cache/miri
          cache-key: miri-${{ matrix.name }}

      # Miri interprets a test process on one core, so nextest runs a process
      # for each test, as many at a time as the runner has cores
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The runtime only: the generator reads and writes no bytes in either
      # order, has no unsafe code, and would take long under Miri
      - name: Run tests under Miri
        run: cargo +nightly miri nextest run -p tafla --target ${{ matrix.target }}

      # Miri isolates the tests from the file system, so the conformance suite
      # is ignored above
      - name: Run the conformance suite under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri nextest run -p tafla --target ${{ matrix.target }} --test conformance --run-ignored all

      # nextest doesn't run the documentation's examples
      - name: Run the documentation's examples under Miri
        run: cargo +nightly miri test -p tafla --target ${{ matrix.target }} --doc

  # A 32-bit usize, as in the generator's WebAssembly module and 32-bit
  # hosts, where positions plus lengths can overflow and a u32 length doesn't
  # always fit
  i686:
    name: Test (32-bit)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: i686-unknown-linux-gnu
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: i686

      # The 32-bit C runtime that the linker needs, so that the tests run
      # natively on the 64-bit runner
      - name: Install the 32-bit C runtime
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-multilib

      # The runtime's tests, including the conformance suite
      - name: Run tests on a 32-bit target
        run: cargo test -p tafla --target i686-unknown-linux-gnu

  benchmark:
    name: Benchmark
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: benchmark

      # Shared runners are too noisy for the numbers to mean much; these runs
      # check that every codec in the comparison reads back what it wrote, and
      # that the benchmarks work
      - name: Run round-trip test
        run: cargo test -p tafla-benchmarks --test round_trip

      - name: Run benchmarks briefly
        run: cargo bench -p tafla-benchmarks -- --warm-up-time 0.05 --measurement-time 0.05 --sample-size 10 --nresamples 1000

      - name: Print the fastest samples
        run: cargo run -p tafla-benchmarks --bin report

      - name: Print encoded sizes
        run: cargo run -p tafla-benchmarks --bin encoding

      - name: Print allocations
        run: cargo run --release -p tafla-benchmarks --bin allocation

  wasm:
    name: WebAssembly
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspaces: rust -> target
          cache-key: wasm

      - name: Setup Node
        uses: ./.github/actions/prepare-node-environment

      # The lint job doesn't compile the module's exports, which only
      # WebAssembly builds have
      - name: Run lint check
        run: cargo clippy -p tafla-gen --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Build the generator's module
        run: cargo build -p tafla-gen --lib --target wasm32-unknown-unknown --profile wasm

      - name: Check that the module has no imports and generates the golden files
        run: node gen/tests/wasm/check.mjs target/wasm32-unknown-unknown/wasm/tafla_gen.wasm

  # The check that the main branch's ruleset requires. It passes when every job
  # passed, or was skipped because the change doesn't touch Rust.
  checks:
    name: Rust checks
    needs: [changes, formatting, lint, test, miri, i686, benchmark, wasm]
    # Runs after a failure too, since GitHub counts a skipped required check as
    # passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
