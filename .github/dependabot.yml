version: 2
updates:
  # Each language adds its own ecosystem when its code moves here
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "daily"
    groups:
      # oxlint requires a version of oxlint-tsgolint, and oxfmt is released
      # with it
      "oxc":
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
      # The shared configurations of oxfmt, oxlint and TypeScript, released
      # from one repository
      "snovader":
        patterns:
          - "@snovader/*"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "daily"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"

  # The Python runtime's native module, a crate of its own, with its own lock
  # file
  - package-ecosystem: "cargo"
    directory: "/python/core/native"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"

  # The tests' module, whose only requirement is the property tests'
  # library, and the benchmarks' module of the libraries they compare. The
  # runtime's module requires nothing.
  - package-ecosystem: "gomod"
    directories:
      - "/go/tests"
      - "/go/benchmarks"
    schedule:
      interval: "daily"

  # The property tests' library, which only the tests depend on, and which
  # Package.resolved pins. The runtime depends on nothing.
  - package-ecosystem: "swift"
    directory: "/swift"
    schedule:
      interval: "daily"

  # The libraries that the benchmarks compare the runtime with, a package of
  # their own, which its Package.resolved pins. FlatBuffers' and protobuf's
  # code is generated by their own generators, of the same versions, which
  # swift/benchmarks/README.md describes rerunning after an update.
  - package-ecosystem: "swift"
    directory: "/swift/benchmarks"
    schedule:
      interval: "daily"

  # The tests', the fuzz targets' and the benchmarks' packages, which
  # Directory.Packages.props pins and each project's packages.lock.json
  # locks. The runtime depends on none. global.json's SDK is a minimum,
  # 10.0.100 or a later feature band, and CI installs the latest, so
  # dotnet-sdk would only raise the minimum.
  - package-ecosystem: "nuget"
    directory: "/csharp"
    schedule:
      interval: "daily"
