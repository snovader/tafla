version: 2
updates:
  # Each language adds its own ecosystem when its code moves here
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "daily"
    groups:
      "vitest":
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "daily"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"

  # The tests' module, whose only requirement is the property tests'
  # library, and the benchmarks' module of the libraries they compare. The
  # runtime's module requires nothing.
  - package-ecosystem: "gomod"
    directories:
      - "/go/tests"
      - "/go/benchmarks"
    schedule:
      interval: "daily"
