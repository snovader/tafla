name: "Release Tag"
description: >-
  Checks a release's tag against the commit that the job checked out, and
  pushes it if asked. A release is tagged <package>/v<version>, but the Swift
  package's tag is its version alone, since SwiftPM takes versions only from
  tags such as 0.1.0. A tag that the repository has must tag that commit: a
  tag records the commit that a version was published from, and the Go module
  proxy keeps the module that its tag named first. The job needs contents:
  write to push.

inputs:
  package:
    description: "The package, such as python"
    required: true
  version:
    description: "Its version, such as 0.1.0"
    required: true
  push:
    description: "Whether to tag the commit and push the tag, if the repository doesn't have it"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # A job run again finds the tag that it pushed
    - name: Check or push the tag
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        PUSH: ${{ inputs.push }}
      run: |
        if [[ "$PACKAGE" == swift ]]; then
          tag=$VERSION
        else
          tag=$PACKAGE/v$VERSION
        fi
        commit=$(git rev-parse HEAD)

        if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          tagged=$(git rev-parse "$tag^{commit}")
          if [[ "$tagged" != "$commit" ]]; then
            echo "::error::$tag tags $tagged, but the run releases $commit"
            exit 1
          fi
          echo "$tag already tags $commit"
        elif [[ "$PUSH" == true ]]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$PACKAGE $VERSION" "$commit"
          git push origin "refs/tags/$tag"
        else
          echo "No tag $tag yet"
        fi
