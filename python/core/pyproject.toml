# maturin builds the platform wheels, with the native module tafla._native,
# and the source distribution. The pure-Python wheel is built from the same
# sources by uv_build, which [tool.uv.build-backend] configures; see
# README.md.
[build-system]
# The release's maturin-action builds with the same version
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "tafla"
version = "0.0.0"
description = "Binary tables of scalars, strings and typed arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snovader" }]
keywords = ["binary", "buffer", "serialization", "table", "typed array", "zero-copy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/snovader/tafla/tree/main/python/core#readme"
Source = "https://github.com/snovader/tafla"
Issues = "https://github.com/snovader/tafla/issues"
Specification = "https://github.com/snovader/tafla/blob/main/SPEC.md"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "tafla._native"
# The Rust runtime's tests, which the source distribution's build doesn't run
exclude = [{ path = "**/rust/core/tests/**", format = "sdist" }]

[tool.uv]
# The native module's sources, which uv rebuilds the package for when they
# change, as it does for this file
cache-keys = [
  { file = "pyproject.toml" },
  { file = "native/Cargo.toml" },
  { file = "native/Cargo.lock" },
  { file = "native/build.rs" },
  { file = "native/src/**/*.rs" },
  { file = "../../rust/core/Cargo.toml" },
  { file = "../../rust/core/src/**/*.rs" },
]

# The pure-Python wheel, which uv_build builds from the same sources: without
# the native module that an editable install builds into the package
[tool.uv.build-backend]
# Windows names the stable ABI's module _native.pyd, without a tag
wheel-exclude = ["tafla/_native*.so", "tafla/_native*.pyd"]
