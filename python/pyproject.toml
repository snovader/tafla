# The workspace root isn't a package. Without a build system, `uv build` here
# would fall back to setuptools and build one named UNKNOWN; with uv_build's, it
# fails for want of a [project], and `uv build --package tafla` builds the
# runtime.
[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["core", "benchmarks"]

[tool.uv]
# The development environment's native module has the tests' hooks, which
# the wheels that maturin builds elsewhere leave out
config-settings-package = { tafla = { build-args = "--features test-hooks" } }

[dependency-groups]
dev = ["hypothesis>=6.170.15", "ruff>=0.17.4", "ty>=0.0.99"]

[tool.ty.src]
include = ["core/src", "core/tests", "benchmarks/src", "benchmarks/tests"]
# protoc's stubs, its verbatim output, leave Mapping's type arguments out
exclude = ["**/*_pb2.pyi"]

[tool.ty.rules]
missing-override-decorator = "error"
missing-type-argument = "error"
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
disjoint-cast = "error"
unsound-yield = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
redundant-condition-strict = "error"

[[tool.ty.overrides]]
# flatc's code imports the flatbuffers package, which imports its submodules
include = ["benchmarks/src/tafla_benchmarks/generated/flatbuffers/**"]
rules = { possibly-missing-submodule = "ignore" }

[tool.ruff]
# protoc's messages are its verbatim output, which regenerating them replaces
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]
# The workspace root has no requires-python of its own to infer these from
src = ["core/src", "core", "benchmarks/src", "benchmarks"]
target-version = "py314"

[tool.ruff.lint]
extend-select = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
# The FlatBuffers modules keep the shape of flatc's Python code: modules named
# after their tables, classes that derive from object, and no annotations
"benchmarks/src/tafla_benchmarks/generated/flatbuffers/*" = ["ANN", "N999", "UP004"]

[tool.ruff.format]
docstring-code-format = false
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
