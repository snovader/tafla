[package]
name = "tafla-gen"
version = "0.0.0"
description = "Compiles tafla schemas into code that writes and reads tables in TypeScript, Python, Java, Rust, Go and C++"
readme = "README.md"
documentation = "https://docs.rs/tafla-gen"
keywords = ["codegen", "schema", "serialization", "tafla", "wasm"]
categories = ["encoding", "development-tools::build-utils", "compilers"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tafla_gen"
# cdylib for the WebAssembly module, see README.md
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tafla-gen"
path = "src/main.rs"

[features]
default = ["typescript", "python", "java", "rust", "go", "cpp"]
# Each target language's generator, so that a crate that generates one
# language from its build script doesn't compile the others. `typescript`
# generates JavaScript too.
typescript = []
python = []
java = []
rust = []
go = []
cpp = []

[dev-dependencies]
# Runs the Rust generated from the example schemas in tests/generated_*.rs. The
# version, which scripts/version.sh sets to the Rust runtime's, is the one
# crates.io resolves it to, so that version of tafla is published first
tafla = { path = "../core", version = "0.0.0" }
proptest = "1"
# Parses the cases of conformance/generated in tests/shapes_cases.rs, with
# floats exactly rather than to within an ulp
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"
must_use_candidate = { level = "allow", priority = 1 }
